name: M8a and STAB-1 integration checks
on:
  push:
    branches:
      - codex/m8a-stab1-integration
  workflow_dispatch:

jobs:
  node-regression:
    name: Complete Node regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  edge-regression:
    name: Edge regressions and ellipse interaction
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix experiments/text-editor-preflight
      - run: npm run test:edge
      - run: node tests/browser-ellipse-render.cjs
      - run: node tests/browser-ellipse-interaction.cjs
