name: M8a-2 point-on-ellipse acceptance
on:
  push:
    branches:
      - codex/m8a-2-point-on-ellipse
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-regressions:
    name: Complete Node regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  edge-regressions:
    name: Full Edge suite and ellipse validations
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix experiments/text-editor-preflight
      - run: npm run test:edge
      - run: node tests/browser-ellipse-render.cjs
      - run: node tests/browser-ellipse-interaction.cjs
